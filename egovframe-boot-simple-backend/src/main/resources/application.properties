# 5. application.yml (\ud14c\uc2a4\ud2b8\uc6a9 \uc124\uc815)

# \ud83d\udc49 \ucd5c\uadfc 5\uac1c\uc758 \ud638\ucd9c \uacb0\uacfc\ub97c \uae30\uc900\uc73c\ub85c \ud310\ub2e8
# - \uc131\uacf5/\uc2e4\ud328\ub97c 5\uac74 \ub2e8\uc704\ub85c \uc9d1\uacc4
# \ud83d\udccc \ud575\uc2ec
# - "\uba87 \uac74\uc744 \ubcf4\uace0 \ud310\ub2e8\ud560 \uac83\uc778\uac00"
resilience4j.circuitbreaker.instances.testCircuit.slidingWindowSize=5

# \ud83d\udc49 \ucd5c\uc18c 5\uac74 \ud638\ucd9c\uc774 \uc313\uc5ec\uc57c CircuitBreaker \ub3d9\uc791
# - 5\uac74 \ubbf8\ub9cc\uc774\uba74 \uc2e4\ud328\uc728 \uacc4\uc0b0 \uc548\ud568
# - \uc989, \ucd08\uae30\uc5d0\ub294 \ubb34\uc870\uac74 \ud1b5\uacfc
# \ud83d\udccc \ud575\uc2ec
# - "\ud45c\ubcf8\uc774 \ucda9\ubd84\ud574\uc57c \ud310\ub2e8"
resilience4j.circuitbreaker.instances.testCircuit.minimumNumberOfCalls=5

# \ud83d\udc49 \uc2e4\ud328\uc728\uc774 50% \uc774\uc0c1\uc774\uba74 OPEN
# \ud83d\udccc \ud575\uc2ec
# - "\uba87 % \uc2e4\ud328\ud558\uba74 \ucc28\ub2e8\ud560 \uac83\uc778\uac00"
resilience4j.circuitbreaker.instances.testCircuit.failureRateThreshold=50

# \ud83d\udc49 OPEN \uc0c1\ud0dc \uc720\uc9c0 \uc2dc\uac04 (1\ucd08)
# - OPEN \uc0c1\ud0dc\uc5d0\uc11c\ub294 \ud638\ucd9c \ucc28\ub2e8
# - 1\ucd08 \ud6c4 \u2192 HALF_OPEN \uc0c1\ud0dc\ub85c \uc804\ud658
# \ud83d\udccc \ud575\uc2ec
# - "\uc5bc\ub9c8\ub098 \uae30\ub2e4\ub838\ub2e4\uac00 \ub2e4\uc2dc \uc2dc\ub3c4\ud560 \uac83\uc778\uac00"
resilience4j.circuitbreaker.instances.testCircuit.waitDurationInOpenState=1s

# \ud83d\udc49 \ud14c\uc2a4\ud2b8 \ube60\ub974\uac8c \ub3cc\ub9ac\ub824\uba74
# window \uc791\uac8c
# waitDuration \uc9e7\uac8c

# \ud83d\udc49 \uc9c0\uae08 \uc124\uc815\uc740
# "\ud14c\uc2a4\ud2b8\uc6a9 (\ube60\ub974\uac8c \ud130\uc9c0\ub294 \uc124\uc815)" \uc785\ub2c8\ub2e4.

# \u2705 \ud55c \uc904 \uc815\ub9ac

# \ud83d\udc49
# "\ucd5c\uadfc 5\uac74 \uc911 50% \uc774\uc0c1 \uc2e4\ud328\ud558\uba74 1\ucd08 \ub3d9\uc548 \ucc28\ub2e8 \ud6c4 \ub2e4\uc2dc \uc2dc\ub3c4"

